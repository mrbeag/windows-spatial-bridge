<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1410 285" role="img" aria-labelledby="title desc">
  <title id="title">Windows Spatial Bridge audio flow</title>
  <desc id="desc">Game audio travels as conventional 7.1 through VB-CABLE into Spatial Bridge. The bridge submits spatial objects to the Windows Spatial Audio API. Windows Sonic, Dolby Atmos, or DTS then render spatial stereo for the headphones. Voice chat travels directly to the headphones as stereo.</desc>
  <style>
    .node { fill: #1f2937; stroke: #6b7280; stroke-width: 2; }
    .device { fill: #172554; stroke: #60a5fa; }
    .node-text { fill: #f9fafb; font: 500 16px "Segoe UI", Arial, sans-serif; text-anchor: middle; }
    .device-detail { fill: #f9fafb; font: 500 14px "Segoe UI", Arial, sans-serif; text-anchor: middle; }
    .device-label { fill: #93c5fd; font: 400 12px "Segoe UI", Arial, sans-serif; text-anchor: middle; }
    .label { fill: #d1d5db; font: 500 15px "Segoe UI", Arial, sans-serif; text-anchor: middle; }
    .arrow { fill: none; stroke: #9ca3af; stroke-width: 2; marker-end: url(#arrow); }
    .spatial-arrow { fill: none; stroke: #10b981; stroke-width: 4; marker-end: url(#spatial-arrow); }
    .spatial-label { fill: #6ee7b7; font: 500 15px "Segoe UI", Arial, sans-serif; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af" />
    </marker>
    <marker id="spatial-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981" />
    </marker>
  </defs>

  <rect width="1410" height="285" fill="#0d1117" />

  <rect class="node" x="15" y="62" width="125" height="58" rx="6" />
  <text class="node-text" x="77.5" y="97">Game audio</text>

  <rect class="node device" x="180" y="50" width="160" height="82" rx="6" />
  <text class="node-text" x="260" y="75">VB-CABLE</text>
  <text class="device-detail" x="260" y="97">7.1 surround</text>
  <text class="device-label" x="260" y="117">(audio source)</text>

  <rect class="node" x="375" y="62" width="155" height="58" rx="6" />
  <text class="node-text" x="452.5" y="97">Spatial Bridge</text>

  <rect class="node" x="700" y="62" width="200" height="58" rx="6" />
  <text class="node-text" x="800" y="87">Windows Spatial</text>
  <text class="node-text" x="800" y="108">Audio API</text>

  <rect class="node" x="940" y="62" width="210" height="58" rx="6" />
  <text class="node-text" x="1045" y="87">Windows Sonic</text>
  <text class="node-text" x="1045" y="108">Dolby Atmos / DTS</text>

  <rect class="node device" x="1250" y="50" width="140" height="82" rx="6" />
  <text class="node-text" x="1320" y="75">Stereo</text>
  <text class="node-text" x="1320" y="95">headphones</text>
  <text class="device-label" x="1320" y="117">(audio source)</text>

  <rect class="node" x="940" y="205" width="150" height="58" rx="6" />
  <text class="node-text" x="1015" y="240">Voice chat</text>

  <path class="arrow" d="M140 91 H180" />
  <text class="label" x="160" y="77">7.1</text>
  <path class="arrow" d="M340 91 H375" />
  <text class="label" x="357.5" y="77">7.1</text>
  <path class="spatial-arrow" d="M530 91 H700" />
  <text class="spatial-label" x="615" y="69">Spatial objects</text>
  <path class="arrow" d="M900 91 H940" />
  <path class="arrow" d="M1150 91 H1250" />
  <text class="label" x="1200" y="77">Spatial 2.0</text>
  <path class="arrow" d="M1090 234 C1180 234 1170 120 1250 106" />
  <text class="label" x="1180" y="205">2.0</text>
</svg>
